<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Flappy Spaceship</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      margin: auto;
      background: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxAQDxIPDxASDxUPFRAVFRUVFRUVFRUQFRUWFhUVFRUYHSggGBolHRUVITEhJSkrLi4uFx8zODMtNygtLisBCgoKDg0OGxAQGy0mHyYvLS8tLS0tLS0tLy0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLf/AABEIAOEA4QMBIgACEQEDEQH/xAAbAAABBQEBAAAAAAAAAAAAAAAEAQIDBQYAB//EAD8QAAIBAgQDBgMGBQQCAwAAAAECEQADBBIhMUFRBRMiYXGBkaGxwQcjQlKx8PEjYoKyFfDxJDRTgpLC8YLSF//EABkBAQADAQEAAAAAAAAAAAAAAAABAgMEBf/EACURAQEAAgICAgIDAAAAAAAAAAABAhEDIRIxQSJRYRQygf/aAAwDAQACEAMQAAABzpgHzgDOPQ0B0GNOFkXVCNnNUNMC41oDPCyE8pmKk8w3Ylmt8RxzeEThqqyNaocS0qlpxk0zF5+3ZKhgtJBo3WhwWN8Re5eYHFcSxXHENRoLoUKr1IG1E5uFBjckuSYEqGpKSOl3YzUeYa+cKqHAc0+3Ce2c5xfLbzHPXBsmFmdjD4x1rTUSwtzvlVLUvLweNOEYneEYc5vqexvwh/Nzd68BpvFJTeK3KzbrRk+O+Ik7aRxZFTexxiXTcIErJHD3V0Vdc2keVgFTglXQUkUyb0TIuqwFbW3g9OjOloNVXFO3HBCnG3r5Iv2s5zJvfyHO7UahwXqbpAHR1O7cFgAAO2eCwAAAkU4DcmcyYIk65e6rJ07kBIsy6qTWcRqbxygYKbnENfEguPFDaIbsrJPVBY9AAfOeIAAAAAAAAP/Z') no-repeat center center fixed;
      background-size: cover;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const spaceshipImg = new Image();
  spaceshipImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAABiElEQVRoge2ZwY3CMBBFz8g9S1tsFwObv0slrSi12ClWEDLs8gxblJOlvPM8Aq/QeeEcQZMGDBgwIABAz6wcAlPGzWLDCYA1m9ZcGAMpgBblBbIsN9CH+CQisJkAv+4zIDlAs88knqcBsUOac/3NocAuacPYJKbQSMwZwxkFlHV5A7jgvG0EPk0tBQBKCh4hCdU7Oa4JUAdclmwKzi4VNAyaHaK94BrIRw0DJofor2DyEkjGQ65hzZZ+mH34gAqVJmmbKkijVeVEGeNYuAbBMgQDL1isrUQdUeqQA4WkyAmzhyojoSoTQSJ63WIYcOew+hNmgNdN0uRUFMLPMY+AGp2jTk90cMTil5os1RBa1fsYx4ncFgAxPSqRQNmYlguIOZgKKaEKp6vAp09ccRMEpkFFKlLHo66DvxL7H0vMAxwYMGDBgwYMCAAQf4A5GLA+0JNmw8AAAAASUVORK5CYII=";

  let spaceship = {
    x: 80,
    y: 150,
    width: 50,
    height: 50,
    gravity: 0.5,
    lift: -8,
    velocity: 0
  };

  let pipes = [];
  let frame = 0;
  let score = 0;

  document.addEventListener("keydown", () => {
    spaceship.velocity = spaceship.lift;
  });

  function drawSpaceship() {
    ctx.drawImage(spaceshipImg, spaceship.x, spaceship.y, spaceship.width, spaceship.height);
  }

  function createPipe() {
    let top = Math.random() * 200 + 50;
    let gap = 120;
    pipes.push({
      x: canvas.width,
      top: top,
      bottom: top + gap,
      width: 50
    });
  }

  function drawPipes() {
    ctx.fillStyle = "#00ffcc";
    pipes.forEach(pipe => {
      ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
      ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);
    });
  }

  function updatePipes() {
    pipes.forEach(pipe => {
      pipe.x -= 2;

      if (
        spaceship.x + spaceship.width > pipe.x &&
        spaceship.x < pipe.x + pipe.width &&
        (spaceship.y < pipe.top || spaceship.y + spaceship.height > pipe.bottom)
      ) {
        alert("Game Over! Score: " + score);
        document.location.reload();
      }

      if (pipe.x + pipe.width < 0) {
        pipes.shift();
        score++;
      }
    });

    if (frame % 100 === 0) {
      createPipe();
    }
  }

  function updateSpaceship() {
    spaceship.velocity += spaceship.gravity;
    spaceship.y += spaceship.velocity;

    if (spaceship.y + spaceship.height > canvas.height || spaceship.y < 0) {
      alert("Game Over! Score: " + score);
      document.location.reload();
    }
  }

  function drawScore() {
    ctx.fillStyle = "#ffffff";
    ctx.font = "24px Arial";
    ctx.fillText("Score: " + score, 10, 30);
  }

  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSpaceship();
    drawPipes();
    drawScore();

    updateSpaceship();
    updatePipes();

    frame++;
    requestAnimationFrame(gameLoop);
  }

  spaceshipImg.onload = () => {
    gameLoop();
  };
</script>
</body>
</html>
